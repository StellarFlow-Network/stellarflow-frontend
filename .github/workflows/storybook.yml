name: Storybook Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: storybook-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-preview:
    if: github.event_name != 'pull_request' || github.head_ref != 'haptic-feedback'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build Storybook (includes TypeScript compilation)
        run: npm run build-storybook
      - name: Check visual regression snapshots
        run: npm run test:visual
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Comment preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const body = `Storybook preview: ${process.env.PREVIEW_URL}`;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number: number });
            const existing = comments.data.find(comment => comment.user.type === 'Bot' && comment.body.startsWith('Storybook preview:'));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
